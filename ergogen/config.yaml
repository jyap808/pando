meta:
  engine: 4.1.0
  name: Pando
  author: Julian Yap
  github: jyap808
  version: v1.1.0
  footer_text: &footer_text "Designed in Washington, USA - by jyap - v1.1"

units:
  # Proxy Spacing Variables
  kx: U
  ky: U
  # Padding Variables
  px: kx + 2
  py: ky + 2
  # Defaults to M2 Screws
  screwSize: 1.1
  # M2 spacer size
  spacerSize: 1.6
  # Tooling size
  toolingSize: 1.6
  standoffHeight: 10
  standoffCoverHeight: 25
  baseFillet: 1.2
  switchFillet: 0.5

  csWall: 3                # Wall thickness
  csMargin: 0.4            # PCB clearance. 0.5mm for FDM, 0.3mm for MJF are safe margins.
  csLip: 3                 # Lip height above plate (7-8mm full coverage, 2-3mm floating)
  csBottomZ: 2.5           # Bottom plate thickness
  csWallZ: csLip + standoffHeight + csBottomZ      # Total wall height

  csScrewSize: 1.6         # M3 screws
  csSOSize: 2.7            # M3 round stand offs. 5mm OD
  # Sandwich
  csWallSW: 7              # Wall thickness
  csFilletSW: 3            # Fillet

points:
  zones:
    matrix:
      key:
        tags: ['key']
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [70, -190]
      columns:
        # Sofle v2/RGBv3 aggressive pinky stagger based
        outer:
          key.column_net: COL0
          rows.mod.skip: true
        pinky:
          key.column_net: COL1
          rows.mod.skip: true
        ring:
          key:
            stagger: 9
            column_net: COL2
          rows.mod.column_net: COL1
        middle:
          key:
            stagger: 2.5
            column_net: COL3
          rows.mod.column_net: COL2
        index:
          key:
            stagger: -2.5
            column_net: COL4
          rows.mod:
            skip: true
            column_net: COL3
          #rows.mod.skip: true
          #rows.mod.column_net: COL3
        inner:
          key:
            stagger: -2.5
            column_net: COL5
          rows.mod.skip: true
      rows:
        # Four main rows, one partial row.
        # Ergogen uses Cartesian Coordinates as opposed to a keyboard matrix
        mod:
          row_net: ROW4
        bottom:
          row_net: ROW3
        home:
          row_net: ROW2
        top:
          row_net: ROW1
        num:
          row_net: ROW0
    thumbs:
      key:
        tags: ['key']
      anchor:
        ref: matrix_index_bottom
        shift: [0, -1U]
      columns:
        top:
          key:
            column_net: COL3
        middle:
          key:
            width: 1.25U
            origin: [-0.6U, -0.8U]
            splay: -30
            column_net: COL4
        bottom:
          key:
            # (1.25+1)/2 - 1 = 0.125
            shift: [0.125U, 0]
            column_net: COL5
      rows:
        cluster:
          row_net: ROW4
    # Mounts - Inner
    mount_inner_top_left:
      anchor:
        ref: matrix_outer_top
        shift: [0.5kx, 0.5ky]
    mount_inner_bottom_left:
      anchor:
        ref: matrix_outer_bottom
        shift: [0.5kx, 0.5ky]
    mount_inner_top_right:
      anchor:
        ref: matrix_inner_top
        shift: [-0.5kx, 0.55ky]
    mount_inner_bottom_middle:
      anchor:
        ref: thumbs_top_cluster
        shift: [-0.5kx, 0.55ky]
    mount_inner_bottom_right:
      anchor:
        ref: thumbs_bottom_cluster
        shift: [-0.55kx, 0.3ky]
    # Mounts - Sandwich Outer
    mount_sw_outer_top_left:
      anchor:
        ref: matrix_outer_num
        shift: [-0.5kx-csWallSW/2-csMargin, 1.3ky]
    mount_sw_outer_top_right:
      anchor:
        ref: matrix_middle_num
        shift: [2.7kx, 0.5ky+csMargin+csWallSW/2+0.5]
    mount_sw_outer_bottom_left:
      anchor:
        ref: matrix_outer_bottom
        shift: [-0.5kx-csWallSW/2-csMargin, -0.5ky-csWallSW/2-csMargin]
    mount_sw_outer_bottom_middle:
      anchor:
        ref: thumbs_top_cluster
        shift: [-0.5kx, -0.5ky-csMargin-csWallSW/2-1]
    mount_sw_outer_bottom_right:
      anchor:
        ref: thumbs_bottom_cluster
        shift: [-0.55kx, 0.5ky+csMargin+csWallSW/2+1]
  mirror: &mirror
    ref: matrix_inner_num
    distance: 5kx

outlines:
  # outline with no padding
  _raw:
    - what: rectangle
      where: /key/
      size: [U,U]
    - what: polygon
      points:
        - ref: thumbs_top_cluster
          shift: [-0.5U, 0.5U]
        - ref: thumbs_top_cluster
          shift: [-0.5U, -0.5U]
        - ref: thumbs_top_cluster
          shift: [1U, -0.5U]
        - ref: thumbs_top_cluster
          shift: [1U, 0.5U]
    - what: polygon
      points:
        # Extend Down
        - ref: matrix_inner_bottom
          shift: [-0.5U, 0.5U]
        - ref: matrix_inner_bottom
          shift: [-0.5U, -1U]
        - ref: matrix_inner_bottom
          shift: [0.5U, -1U]
        - ref: matrix_inner_bottom
          shift: [0.5U, 0.5U]
    - what: polygon
      points:
        # Extend Left
        - ref: thumbs_middle_cluster
          shift: [-1U, 0.5U]
        - ref: thumbs_middle_cluster
          shift: [-1U, -0.5U]
        - ref: thumbs_middle_cluster
          shift: [1U, -0.5U]
        - ref: thumbs_middle_cluster
          shift: [1U, 0.5U]
      fillet: baseFillet
  keys:
    - what: rectangle
      where: /key/
      size: [14,14]
      fillet: switchFillet
  combo_print:
    # Used for printing out and testing layout
    - name: _raw
    - operation: subtract
      name: keys

  _matrix_area_right:
    $extends: outlines._matrix_area_left
    $args: ["mirror_"]
  _matrix_area_left:
    $params: [<mirror>]
    $args: [""]
    area:
      what: rectangle
      where:
        - [/^<mirror>matrix_.*/]
      size: [px, py]

  _thumb_area_right:
    $extends: outlines._thumb_area_left
    $args: [mirror_, right]
  _thumb_area_left:
    $params: [<mirror>, <side>]
    $args: ["", "left"]
    cluster:
      what: polygon
      points:
        # bottom middle
        - ref: <mirror>thumbs_middle_cluster
          shift: [-2U, -0.5py]
        # bottom right
        - ref: <mirror>thumbs_bottom_cluster
          shift: [0.5px, -0.5py]
        - ref: <mirror>thumbs_bottom_cluster
          shift: [0.5px, 0.5py]
        - ref: <mirror>thumbs_middle_cluster
          shift: [-2U, 0.5py]

  _bottom_extension_right:
    $extends: outlines._bottom_extension_left
    $args: [mirror_]
  _bottom_extension_left:
    $params: [<mirror>]
    $args: [""]
    extension:
      what: polygon
      points:
        - ref: <mirror>matrix_ring_mod
          shift: [0, 1U]
        - ref: <mirror>matrix_ring_mod
          shift: [0, -0.5py]
        - ref: <mirror>matrix_ring_mod
          shift: [3U, -0.5py]
        - ref: <mirror>matrix_ring_mod
          shift: [3U, 1U]

  # Excludes the old MCU and RJ45 area
  _top_extension_right:
    $extends: outlines._top_extension_left
    $args: [mirror_]
  _top_extension_left:
    $params: [<mirror>]
    $args: [""]
    extension:
      what: polygon
      points:
        # All based off of the matrix middle num key
        # top left
        - ref: <mirror>matrix_middle_num
          shift: [-67.525, 0.5py]
        # bottom left
        - ref: <mirror>matrix_middle_num
          shift: [-67.525, -0.5U]
        # bottom right
        - ref: <mirror>matrix_middle_num
          shift: [48.525, -4.5U]
        # top right
        - ref: <mirror>matrix_middle_num
          shift: [48.525, 0.5py]

  # PCB Base outline with no fillets
  pcb_base_right:
    $extends: outlines.pcb_base_left
    $args: [right]
  pcb_base_left:
    $params: [<side>]
    $args: [left]
    matrix:
      what: outline
      name: _matrix_area_<side>
    top:
      what: outline
      name: _top_extension_<side>
    thumb:
      what: outline
      name: _thumb_area_<side>
    bottom:
      what: outline
      name: _bottom_extension_<side>
  
  pcb_right:
    $extends: outlines.pcb_left
    $args: [right]
  pcb_left:
    $params: [<side>]
    $args: [left]
    expand1:
      what: outline
      name: pcb_base_<side>
      expand: 0
      fillet: baseFillet

  # Plate Base outline with no fillets and no switch cut outs
  plate_base_left:
    $params: [<side>]
    $args: [left]
    matrix:
      what: outline
      name: _matrix_area_<side>
    top:
      what: outline
      name: _top_extension_<side>
    thumb:
      what: outline
      name: _thumb_area_<side>
    bottom:
      what: outline
      name: _bottom_extension_<side>

  # Expanded plate to subtract for lip
  _plate_base_expanded_left:
    $params: [<side>]
    $args: [left]
    expand1:
      what: outline
      name: plate_base_<side>
      expand: csMargin

  # Plate does not need to be mirrored
  # FR4 version.
  plate:
    matrix:
      what: outline
      name: _matrix_area_left
      fillet: baseFillet
    top:
      what: outline
      name: _top_extension_left
      fillet: baseFillet
    thumb:
      what: outline
      name: _thumb_area_left
      fillet: baseFillet
    bottom:
      what: outline
      name: _bottom_extension_left
    switch:
      what: rectangle
      size: [14,14]
      fillet: switchFillet
      where: /key/
      operation: subtract

  # 3D printed case - Dedicated left and right sides
  # In theory we can mirror this in the slicer
  case_outer_right:
    $args: [right]
    $extends: outlines.case_outer_left
  # Couldn't get extends to work here
  case_outer_left:
    $params: [<side>]
    $args: [left]
    expand1:
      what: outline
      name: pcb_<side>
      expand: csMargin+csWall

  case_inner_right:
    $args: [right]
    $extends: outlines.case_inner_left
  # Couldn't get extends to work here
  case_inner_left:
    $params: [<side>]
    $args: [left]
    expand1:
      what: outline
      name: pcb_<side>
      expand: csMargin

  # Non-FR4 version with M2 screw mounts
  _mounts_right:
    $extends: outlines._mounts_left
    $args: [mirror_, right]
  _mounts_left:
    $params: [<mirror>, <side>]
    $args: ["", left]
    mount_inner:
      what: circle
      radius: screwSize
      where:
        - [/^<mirror>mount_inner_.*/]

  # Sandwich case
  _mounts_sw_right:
    $extends: outlines._mounts_sw_left
    $args: [mirror_, right]
  _mounts_sw_left:
    $params: [<mirror>, <side>]
    $args: ["", left]
    mount_sw:
      what: circle
      radius: csScrewSize
      where:
        - [/^<mirror>mount_sw_.*/]

  case_sw_outer_right:
    $extends: outlines.case_sw_outer_left
    $args: [right]
  # Couldn't get extends to work here
  case_sw_outer_left:
    $params: [<side>]
    $args: [left]
    expand1:
      what: outline
      name: pcb_base_<side>
      joints: pointy
      expand: csMargin+csWallSW
      fillet: csFilletSW
    mounts:
      what: outline
      name: _mounts_<side>
      operation: subtract
    mounts_sw:
      what: outline
      name: _mounts_sw_<side>
      operation: subtract

  # Bottom weight does not need to be mirrored
  # Metal version.
  bottom_weight:
    matrix:
      what: outline
      name: _matrix_area_left
      fillet: baseFillet
    top:
      what: outline
      name: _top_extension_left
      fillet: baseFillet
    thumb:
      what: outline
      name: _thumb_area_left
      fillet: baseFillet
    bottom:
      what: outline
      name: _bottom_extension_left
    mounts:
      what: outline
      name: _mounts_left
      operation: subtract

pcbs:
  pando_right:
    $args: [right, "mirror_"]
    $extends: pcbs.pando_left
    footprints:
      diode:
        adjust:
          rotate: 90
          shift: [7.45, 1]
      text_side:
        params:
          text: RIGHT PCB
      # Since there is no main USBC needed, the USBC interconnect becomes reference J1
      j1:
        where: false
      # The interconnect fuse becomes reference F1
      f1:
        where: mirror_matrix_middle_num
        adjust:
          shift: [44.092, 0.17]
      f2:
        where: false
      # IO Expander
      u1:
        where: mirror_matrix_middle_num
        adjust:
          shift: [-47.408, 3.32]
        params:
          description: "Swap with Package_SO:TSSOP-24_4.4x7.8mm_P0.65mm"
          width: 7.7
          height: 8.3
      u2:
        where: mirror_matrix_middle_num
        adjust:
          shift: [38.592, 0.17]
          rotate: -90
        params:
          description: "Swap with Package_TO_SOT_SMD:SOT-143"
          width: 3.2
          height: 3.4
      c1:
        where: mirror_matrix_middle_num
        adjust:
          shift: [35.092, 0.17]
          rotate: 90
      r1:
        where: mirror_matrix_middle_num
        adjust:
          shift: [33.342, 5.42]
          rotate: 180
      r2:
        where: mirror_matrix_middle_num
        adjust:
          shift: [33.342, 3.67]
          rotate: 180
      # Removals
      rst1:
        where: false
      boot1:
        where: false
      c2:
        where: false
      c3:
        where: false
      c4:
        where: false
      c5:
        where: false
      c6:
        where: false
      c7:
        where: false
      c8:
        where: false
      c9:
        where: false
      c10:
        where: false
      c11:
        where: false
      r3:
        where: false
      r4:
        where: false
      r5:
        where: false
      r6:
        where: false
      r7:
        where: false
      r8:
        where: false
      u3:
        where: false
      u4:
        where: false

  pando_left:
    $params: [<side>, <mirror>]
    $args: [left, ""]
    template: kicad8
    outlines:
      main:
        outline: pcb_<side>
    footprints:
      mx:
        what: ceoloide/switch_mx
        where:
          -
            - /^<mirror>(matrix|thumbs)_.*/
        adjust:
          rotate: 180
        params:
          designator: MX
          from: "{{column_net}}"
          to: "{{colrow}}"
          include_corner_marks: true
          solder: false
          hotswap: true
          reversible: false
          include_keycap: true
      diode:
        what: ceoloide/diode_tht_sod123
        where:
          -
            - /^<mirror>(matrix|thumbs)_.*/
        adjust:
          shift: [-7.45, 1]
          rotate: -90
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          reversible: false
      text:
        what: ceoloide/utility_text
        where:
          -
            - /^<mirror>matrix_index_num$/
        params:
          side: B
          mirrored: true
          bold: true
          italic: true
          text: Pando
          face: IBM Plex Mono
          width: 3
          height: 3
        adjust:
          shift: [0, 0.5U]
      text_footer:
        what: ceoloide/utility_text
        where:
          -
            - /^<mirror>matrix_ring_mod$/
        params:
          side: B
          mirrored: true
          face: IBM Plex Mono
          text: *footer_text
        adjust:
          shift: [1U, -0.45U]
      text_side:
        what: ceoloide/utility_text
        where:
          -
            - /^<mirror>matrix_middle_num$/
        params:
          side: B
          mirrored: true
          text: LEFT PCB
          face: IBM Plex Mono
        adjust:
          shift: [47.5, 5]
          rotate: 90
      logo:
        what: pando_logo
        where:
          -
            - /^<mirror>matrix_middle_mod$/
        params:
          side: B
        adjust:
          shift: [33, -1]
      j1:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-3.15U, 8.175] # USBC port courtyard extends out 1.8mm.
        params:
          designator: J
          description: "Swap with PCM_marbastlib-various:USB_C_Receptacle_HRO_TYPE-C-31-M-12"
          back: true
          width: 10.64
          height: 8.3
      j2:
        what: placeholder
        where:
          -
            - /^<mirror>matrix_middle_num$/
        adjust:
          shift: [2.15U, 8.175] # USBC port courtyard extends out 1.8mm.
        params:
          designator: J
          description: "Swap with PCM_marbastlib-various:USB_C_Receptacle_HRO_TYPE-C-31-M-12"
          back: true
          width: 10.64
          height: 8.3
      boot1:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-12, 7.5]
        params:
          designator: BOOT
          description: "Swap with Button_Switch_SMD:SW_SPST_TL3342"
          back: true
          width: 8.5
          height: 6
      rst1:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-22.5, 7.5]
        params:
          designator: RST
          description: "Swap with Button_Switch_SMD:SW_SPST_TL3342"
          back: true
          width: 8.5
          height: 6
      # MCU
      u1:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-38.5, 3]
        params:
          designator: U
          description: "Swap with Package_QFP:LQFP-48_7x7mm_P0.5mm"
          back: true
          width: 10.3
          height: 10.3
      u2:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-62, -0.75]
        params:
          designator: U
          description: "Swap with Package_TO_SOT_SMD:SOT-143"
          back: true
          width: 3.2
          height: 3.4
      u3:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-49, 3.75]
          rotate: -90
        params:
          designator: U
          description: "Swap with Package_TO_SOT_SMD:SOT-23-3"
          back: true
          width: 4.1
          height: 3.4
      u4:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [41.5, -0.25]
        params:
          designator: U
          description: "Swap with Package_TO_SOT_SMD:SOT-143"
          back: true
          width: 3.2
          height: 3.4
      r1:
        what: placeholder
        where: matrix_middle_num
        adjust:
          shift: [-58.25, -0.5]
        params:
          designator: R
          description: "Swap with Resistor_SMD:R_0603_1608Metric"
          back: true
